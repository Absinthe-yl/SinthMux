services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sinthmux
      POSTGRES_USER: sinthmux
      POSTGRES_PASSWORD: sinthmux-dev-only
    volumes:
      - sinthmux-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinthmux"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub:
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
    environment:
      SINTHMUX_HUB_ADDR: :8080
      SINTHMUX_DEV_TOKEN: ${SINTHMUX_DEV_TOKEN:-sinthmux-local-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sinthmux-postgres:
